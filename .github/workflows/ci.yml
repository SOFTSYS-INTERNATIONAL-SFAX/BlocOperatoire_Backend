name: CI — Backend Spring Boot

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1 : Compilation + tests unitaires (sans base de données) ───────────
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn clean compile -DskipTests -q

      - name: Run clinical score unit tests
        run: |
          mvn test \
            -Dtest="SofaCalculatorTest,ApacheCalculatorTest,AldreteCalculatorTest,GcsCalculatorTest,EvaCalculatorTest" \
            -DfailIfNoTests=false \
            -q

  # ── Job 2 : Tests d'intégration Spring Boot + PostgreSQL ──────────────────
  integration-tests:
    name: Integration Tests (Spring + PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bloc_operatoire_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run security integration tests
        continue-on-error: true
        run: |
          mvn test \
            -Dtest="UserSecurityTest" \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/bloc_operatoire_db \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=postgres \
            -Dspring.flyway.enabled=true \
            -Dspring.flyway.baseline-on-migrate=true \
            -q
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
