name: CD — Backend Spring Boot

on:
  push:
    branches: [main]

jobs:
  # ── Job 1 : Build + push image Docker Hub ────────────────────────────────────
  build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: emna11135283
          password: ${{ secrets.EMNA11135283 }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            emna11135283/pfe:backend
            emna11135283/pfe:backend-${{ github.sha }}

  # ── Job 2 : Déploiement sur le serveur local ──────────────────────────────────
  deploy:
    name: Deploy on server
    runs-on: self-hosted
    needs: build-push
    steps:
      - name: Pull new image
        working-directory: C:\Users\2026\Desktop\PFE2026
        run: docker compose pull backend

      - name: Restart backend
        working-directory: C:\Users\2026\Desktop\PFE2026
        run: docker compose up -d backend

      - name: Verify container is running
        run: docker ps --filter "name=backend" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
